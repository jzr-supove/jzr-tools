[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "jzr-tools"
version = "0.1.0"
description = "Personal cross-platform CLI toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # click is used directly for the dynamic `<from>2<to>` convert subcommands.
  "click>=8.1,<9.0",
  "typer>=0.12,<1.0",
]

[project.scripts]
jzr = "jzr_tools.cli:main"

[tool.uv]
package = true
