[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "jzr-tools"
version = "0.1.0"
description = "Personal cross-platform CLI toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1,<9.0",
  "psutil>=6.0,<8.0",
]

[project.scripts]
jzr = "jzr_tools.cli:main"

[tool.uv]
package = true
