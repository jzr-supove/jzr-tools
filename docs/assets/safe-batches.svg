<svg xmlns="http://www.w3.org/2000/svg" width="960" height="302" viewBox="0 0 960 302" role="img" aria-label="Batch commands: pick, preview, write to a temporary file, protect existing files, report"><title>Batch commands: pick, preview, write to a temporary file, protect existing files, report</title><style>
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','IBM Plex Sans',Helvetica,Arial,sans-serif}
.b{font-weight:700}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cursor{animation:blink 1.1s step-end infinite}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00ff99"/></marker></defs><rect x=".5" y=".5" width="959" height="301" rx="14" fill="#1c1c22" stroke="#34343d"/><text x="28" y="48" class="sans b" font-size="22" fill="#f7f6f2">Safe with your files</text><text x="28" y="74" class="sans" font-size="14" fill="#9a9aa6">Every command that takes many files follows the same steps.</text><rect x="28.0" y="96" width="156.8" height="176" rx="10" fill="#26262d" stroke="#34343d"/><rect x="44.0" y="112" width="24" height="24" rx="5" fill="#00ff99"/><text x="56.0" y="129" class="mono b" font-size="13" fill="#1c1c22" text-anchor="middle">1</text><text x="78.0" y="129" class="sans b" font-size="15" fill="#f7f6f2">Pick</text><text x="44.0" y="162" class="mono" font-size="12" fill="#00ff99">-d DIR -r</text><text x="44.0" y="190" class="sans" font-size="12.5" fill="#d4d4dc">List files, or scan</text><text x="44.0" y="208" class="sans" font-size="12.5" fill="#d4d4dc">a folder; filter</text><text x="44.0" y="226" class="sans" font-size="12.5" fill="#d4d4dc">names with a regex.</text><line x1="188.8" y1="184.0" x2="210.8" y2="184.0" stroke="#00ff99" stroke-width="2" marker-end="url(#ah)"/><rect x="214.8" y="96" width="156.8" height="176" rx="10" fill="#26262d" stroke="#34343d"/><rect x="230.8" y="112" width="24" height="24" rx="5" fill="#00ff99"/><text x="242.8" y="129" class="mono b" font-size="13" fill="#1c1c22" text-anchor="middle">2</text><text x="264.8" y="129" class="sans b" font-size="15" fill="#f7f6f2">Preview</text><text x="230.8" y="162" class="mono" font-size="12" fill="#00ff99">--dry-run</text><text x="230.8" y="190" class="sans" font-size="12.5" fill="#d4d4dc">Shows every output</text><text x="230.8" y="208" class="sans" font-size="12.5" fill="#d4d4dc">it would write, and</text><text x="230.8" y="226" class="sans" font-size="12.5" fill="#d4d4dc">writes nothing.</text><line x1="375.6" y1="184.0" x2="397.6" y2="184.0" stroke="#00ff99" stroke-width="2" marker-end="url(#ah)"/><rect x="401.6" y="96" width="156.8" height="176" rx="10" fill="#26262d" stroke="#34343d"/><rect x="417.6" y="112" width="24" height="24" rx="5" fill="#00ff99"/><text x="429.6" y="129" class="mono b" font-size="13" fill="#1c1c22" text-anchor="middle">3</text><text x="451.6" y="129" class="sans b" font-size="15" fill="#f7f6f2">Write</text><text x="417.6" y="162" class="mono" font-size="12" fill="#00ff99">jzr-tmp-…</text><text x="417.6" y="190" class="sans" font-size="12.5" fill="#d4d4dc">Output goes to a</text><text x="417.6" y="208" class="sans" font-size="12.5" fill="#d4d4dc">temporary name and</text><text x="417.6" y="226" class="sans" font-size="12.5" fill="#d4d4dc">is renamed only</text><text x="417.6" y="244" class="sans" font-size="12.5" fill="#d4d4dc">when complete.</text><line x1="562.4" y1="184.0" x2="584.4" y2="184.0" stroke="#00ff99" stroke-width="2" marker-end="url(#ah)"/><rect x="588.4" y="96" width="156.8" height="176" rx="10" fill="#26262d" stroke="#34343d"/><rect x="604.4" y="112" width="24" height="24" rx="5" fill="#00ff99"/><text x="616.4" y="129" class="mono b" font-size="13" fill="#1c1c22" text-anchor="middle">4</text><text x="638.4" y="129" class="sans b" font-size="15" fill="#f7f6f2">Protect</text><text x="604.4" y="162" class="mono" font-size="12" fill="#00ff99">--overwrite</text><text x="604.4" y="190" class="sans" font-size="12.5" fill="#d4d4dc">Existing files are</text><text x="604.4" y="208" class="sans" font-size="12.5" fill="#d4d4dc">never replaced</text><text x="604.4" y="226" class="sans" font-size="12.5" fill="#d4d4dc">unless you ask.</text><line x1="749.2" y1="184.0" x2="771.2" y2="184.0" stroke="#00ff99" stroke-width="2" marker-end="url(#ah)"/><rect x="775.2" y="96" width="156.8" height="176" rx="10" fill="#26262d" stroke="#34343d"/><rect x="791.2" y="112" width="24" height="24" rx="5" fill="#00ff99"/><text x="803.2" y="129" class="mono b" font-size="13" fill="#1c1c22" text-anchor="middle">5</text><text x="825.2" y="129" class="sans b" font-size="15" fill="#f7f6f2">Report</text><text x="791.2" y="162" class="mono" font-size="12" fill="#00ff99">exit 1</text><text x="791.2" y="190" class="sans" font-size="12.5" fill="#d4d4dc">One line per file.</text><text x="791.2" y="208" class="sans" font-size="12.5" fill="#d4d4dc">A bad file fails</text><text x="791.2" y="226" class="sans" font-size="12.5" fill="#d4d4dc">alone; the rest</text><text x="791.2" y="244" class="sans" font-size="12.5" fill="#d4d4dc">carry on.</text></svg>
