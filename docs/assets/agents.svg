<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-label="How AI agents reach jzr: a skill for agents with a shell, an MCP server for apps without one"><title>How AI agents reach jzr: a skill for agents with a shell, an MCP server for apps without one</title><style>
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','IBM Plex Sans',Helvetica,Arial,sans-serif}
.b{font-weight:700}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cursor{animation:blink 1.1s step-end infinite}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00ff99"/></marker></defs><rect x=".5" y=".5" width="959" height="403" rx="14" fill="#1c1c22" stroke="#34343d"/><text x="28" y="48" class="sans b" font-size="22" fill="#f7f6f2">Let your AI agent use jzr</text><text x="28" y="74" class="sans" font-size="14" fill="#9a9aa6">It runs one jzr command instead of writing an ffmpeg or Pillow script.</text><rect x="28" y="104" width="262" height="120" rx="10" fill="#26262d" stroke="#34343d"/><text x="46" y="136" class="sans b" font-size="15" fill="#f7f6f2">Agents with a shell</text><text x="46" y="166" class="sans" font-size="13" fill="#d4d4dc">Claude Code · Codex · Cursor</text><text x="46" y="186" class="sans" font-size="13" fill="#d4d4dc">Gemini CLI · Goose · Devin</text><rect x="344" y="104" width="262" height="120" rx="10" fill="#26262d" stroke="#34343d"/><rect x="362" y="123" width="9" height="9" rx="2" fill="#00ff99"/><text x="379" y="132" class="sans b" font-size="15" fill="#f7f6f2">Skill</text><text x="362" y="158" class="mono" font-size="12.5" fill="#00ff99">jzr agent install</text><text x="362" y="186" class="sans" font-size="12.5" fill="#9a9aa6">A short guide: which jzr</text><text x="362" y="204" class="sans" font-size="12.5" fill="#9a9aa6">command does the job</text><path d="M292 164C316.0 164 316.0 164 340 164" fill="none" stroke="#00ff99" stroke-width="2" marker-end="url(#ah)"/><path d="M608 164C634.0 164 634.0 227 660 227" fill="none" stroke="#00ff99" stroke-width="2" marker-end="url(#ah)"/><rect x="28" y="250" width="262" height="120" rx="10" fill="#26262d" stroke="#34343d"/><text x="46" y="282" class="sans b" font-size="15" fill="#f7f6f2">Apps without a shell</text><text x="46" y="312" class="sans" font-size="13" fill="#d4d4dc">Claude Desktop · VS Code</text><text x="46" y="332" class="sans" font-size="13" fill="#d4d4dc">Zed · Cline · any MCP client</text><rect x="344" y="250" width="262" height="120" rx="10" fill="#26262d" stroke="#34343d"/><rect x="362" y="269" width="9" height="9" rx="2" fill="#00ff99"/><text x="379" y="278" class="sans b" font-size="15" fill="#f7f6f2">MCP server</text><text x="362" y="304" class="mono" font-size="12.5" fill="#00ff99">jzr agent install --mcp</text><text x="362" y="332" class="sans" font-size="12.5" fill="#9a9aa6">Typed tools over stdio,</text><text x="362" y="350" class="sans" font-size="12.5" fill="#9a9aa6">started as jzr agent mcp</text><path d="M292 310C316.0 310 316.0 310 340 310" fill="none" stroke="#00ff99" stroke-width="2" marker-end="url(#ah)"/><path d="M608 310C634.0 310 634.0 227 660 227" fill="none" stroke="#00ff99" stroke-width="2" marker-end="url(#ah)"/><rect x="664" y="104" width="268" height="266" rx="10" fill="#26262d" stroke="#34343d"/><g transform="translate(682 120) scale(0.2424)"><g fill="#F7F6F2" fill-rule="evenodd"><path transform="translate(3 3)" d="M27 0H58V44Q58 60 42 60H15Q0 60 0 45V38H14V44Q14 47 18 47H39Q44 47 44 42V13H27Z"/><path transform="translate(73 3)" d="M0 0H62V12L21 47H62V60H0V48L41 13H0Z"/><path transform="translate(143 3)" d="M0 0H45Q60 0 60 15V25Q60 37 48 39L62 60H45L30 40H14V60H0Z M14 13H41Q46 13 46 18V22Q46 27 41 27H14Z"/></g><rect x="213" y="49" width="14" height="14" rx="3" fill="#00FF99"/></g><text x="750" y="133" class="sans b" font-size="15" fill="#f7f6f2">on your machine</text><rect x="682" y="160" width="10" height="10" rx="2" fill="#00ff99"/><text x="700" y="170" class="sans b" font-size="13.5" fill="#f7f6f2">Read only</text><text x="700" y="190" class="sans" font-size="12.5" fill="#9a9aa6">info, text, hash, diff, port show</text><rect x="682" y="219" width="10" height="10" rx="2" fill="#ffc857"/><text x="700" y="229" class="sans b" font-size="13.5" fill="#f7f6f2">New files only</text><text x="700" y="249" class="sans" font-size="12.5" fill="#9a9aa6">convert, compress, trim, merge;</text><text x="700" y="266" class="sans" font-size="12.5" fill="#9a9aa6">never replaces an existing file</text><rect x="682" y="295" width="10" height="10" rx="2" fill="#ff6b6b"/><text x="700" y="305" class="sans b" font-size="13.5" fill="#f7f6f2">Destructive</text><text x="700" y="325" class="sans" font-size="12.5" fill="#9a9aa6">rename apply, tag edits, port kill;</text><text x="700" y="342" class="sans" font-size="12.5" fill="#9a9aa6">marked, so the client asks first</text></svg>
