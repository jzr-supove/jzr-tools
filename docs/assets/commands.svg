</style><rect x=".5" y=".5" width="959" height="809" rx="14" fill="#1c1c22" stroke="#34343d"/><text x="28" y="48" class="sans b" font-size="22" fill="#f7f6f2">One command for everyday jobs: <tspan class="mono" fill="#00ff99">jzr &lt;thing&gt; &lt;action&gt;</tspan></text><text x="28" y="74" class="sans" font-size="14" fill="#9a9aa6">Grouped by what it works on. Windows, macOS and Linux.</text><g transform="translate(866 30) scale(0.3030)"><g fill="#F7F6F2" fill-rule="evenodd"><path transform="translate(3 3)" d="M27 0H58V44Q58 60 42 60H15Q0 60 0 45V38H14V44Q14 47 18 47H39Q44 47 44 42V13H27Z"/><path transform="translate(73 3)" d="M0 0H62V12L21 47H62V60H0V48L41 13H0Z"/><path transform="translate(143 3)" d="M0 0H45Q60 0 60 15V25Q60 37 48 39L62 60H45L30 40H14V60H0Z M14 13H41Q46 13 46 18V22Q46 27 41 27H14Z"/></g><rect x="213" y="49" width="14" height="14" rx="3" fill="#00FF99"/></g><rect x="28.0" y="96" width="290.7" height="152" rx="10" fill="#26262d" stroke="#34343d"/><rect x="46.0" y="115" width="9" height="9" rx="2" fill="#00ff99"/><text x="63.0" y="124" class="sans b" font-size="15" fill="#f7f6f2">Images</text><text x="300.7" y="124" class="mono" font-size="12" fill="#00ff99" text-anchor="end">jzr image</text><text x="46.0" y="148" class="sans" font-size="12.5" fill="#9a9aa6">HEIC, AVIF, WebP, animated GIFs</text><rect x="46.0" y="160" width="254.7" height="1" fill="#34343d"/><text x="46.0" y="184" class="mono" font-size="12.5" fill="#d4d4dc">convert</text><text x="46.0" y="203" class="mono" font-size="12.5" fill="#d4d4dc">compress</text><text x="46.0" y="222" class="mono" font-size="12.5" fill="#d4d4dc">resize</text><text x="173.3" y="184" class="mono" font-size="12.5" fill="#d4d4dc">strip</text><text x="173.3" y="203" class="mono" font-size="12.5" fill="#d4d4dc">info</text><text x="173.3" y="222" class="mono" font-size="12.5" fill="#d4d4dc">png2jpg …</text><rect x="334.7" y="96" width="290.7" height="152" rx="10" fill="#26262d" stroke="#34343d"/><rect x="352.7" y="115" width="9" height="9" rx="2" fill="#00ff99"/><text x="369.7" y="124" class="sans b" font-size="15" fill="#f7f6f2">Video</text><text x="607.3" y="124" class="mono" font-size="12" fill="#00ff99" text-anchor="end">jzr video</text><text x="352.7" y="148" class="sans" font-size="12.5" fill="#9a9aa6">Fit any limit: --for discord</text><rect x="352.7" y="160" width="254.7" height="1" fill="#34343d"/><text x="352.7" y="184" class="mono" font-size="12.5" fill="#d4d4dc">convert</text><text x="352.7" y="203" class="mono" font-size="12.5" fill="#d4d4dc">compress</text><text x="352.7" y="222" class="mono" font-size="12.5" fill="#d4d4dc">trim</text><text x="480.0" y="184" class="mono" font-size="12.5" fill="#d4d4dc">gif</text><text x="480.0" y="203" class="mono" font-size="12.5" fill="#d4d4dc">info</text><text x="480.0" y="222" class="mono" font-size="12.5" fill="#d4d4dc">mov2mp4 …</text><rect x="641.3" y="96" width="290.7" height="152" rx="10" fill="#26262d" stroke="#34343d"/><rect x="659.3" y="115" width="9" height="9" rx="2" fill="#00ff99"/><text x="676.3" y="124" class="sans b" font-size="15" fill="#f7f6f2">Audio</text><text x="914.0" y="124" class="mono" font-size="12" fill="#00ff99" text-anchor="end">jzr audio</text><text x="659.3" y="148" class="sans" font-size="12.5" fill="#9a9aa6">Tags, cover art and lyrics too</text><rect x="659.3" y="160" width="254.7" height="1" fill="#34343d"/><text x="659.3" y="184" class="mono" font-size="12.5" fill="#d4d4dc">convert</text><text x="659.3" y="203" class="mono" font-size="12.5" fill="#d4d4dc">trim</text><text x="659.3" y="222" class="mono" font-size="12.5" fill="#d4d4dc">tags</text><text x="786.7" y="184" class="mono" font-size="12.5" fill="#d4d4dc">info</text><text x="786.7" y="203" class="mono" font-size="12.5" fill="#d4d4dc">wav2mp3 …</text><rect x="28.0" y="264" width="290.7" height="152" rx="10" fill="#26262d" stroke="#34343d"/><rect x="46.0" y="283" width="9" height="9" rx="2" fill="#00ff99"/><text x="63.0" y="292" class="sans b" font-size="15" fill="#f7f6f2">PDF</text><text x="300.7" y="292" class="mono" font-size="12" fill="#00ff99" text-anchor="end">jzr pdf</text><text x="46.0" y="316" class="sans" font-size="12.5" fill="#9a9aa6">Never changes the source file</text><rect x="46.0" y="328" width="254.7" height="1" fill="#34343d"/><text x="46.0" y="352" class="mono" font-size="12.5" fill="#d4d4dc">merge</text><text x="46.0" y="371" class="mono" font-size="12.5" fill="#d4d4dc">split</text><text x="46.0" y="390" class="mono" font-size="12.5" fill="#d4d4dc">organize</text><text x="46.0" y="409" class="mono" font-size="12.5" fill="#d4d4dc">compress</text><text x="173.3" y="352" class="mono" font-size="12.5" fill="#d4d4dc">images</text><text x="173.3" y="371" class="mono" font-size="12.5" fill="#d4d4dc">from-images</text><text x="173.3" y="390" class="mono" font-size="12.5" fill="#d4d4dc">text</text><text x="173.3" y="409" class="mono" font-size="12.5" fill="#d4d4dc">info</text><rect x="334.7" y="264" width="290.7" height="152" rx="10" fill="#26262d" stroke="#34343d"/><rect x="352.7" y="283" width="9" height="9" rx="2" fill="#00ff99"/><text x="369.7" y="292" class="sans b" font-size="15" fill="#f7f6f2">Data</text><text x="607.3" y="292" class="mono" font-size="12" fill="#00ff99" text-anchor="end">jzr data</text><text x="352.7" y="316" class="sans" font-size="12.5" fill="#9a9aa6">JSON, YAML, CSV, TOML, Excel</text><rect x="352.7" y="328" width="254.7" height="1" fill="#34343d"/><text x="352.7" y="352" class="mono" font-size="12.5" fill="#d4d4dc">json</text><text x="352.7" y="371" class="mono" font-size="12.5" fill="#d4d4dc">convert</text><rect x="641.3" y="264" width="290.7" height="152" rx="10" fill="#26262d" stroke="#34343d"/><rect x="659.3" y="283" width="9" height="9" rx="2" fill="#00ff99"/><text x="676.3" y="292" class="sans b" font-size="15" fill="#f7f6f2">Text</text><text x="914.0" y="292" class="mono" font-size="12" fill="#00ff99" text-anchor="end">jzr text</text><text x="659.3" y="316" class="sans" font-size="12.5" fill="#9a9aa6">Slugs, Base64, URLs, coloured diffs</text><rect x="659.3" y="328" width="254.7" height="1" fill="#34343d"/><text x="659.3" y="352" class="mono" font-size="12.5" fill="#d4d4dc">slug</text><text x="659.3" y="371" class="mono" font-size="12.5" fill="#d4d4dc">base64</text><text x="659.3" y="390" class="mono" font-size="12.5" fill="#d4d4dc">url</text><text x="786.7" y="352" class="mono" font-size="12.5" fill="#d4d4dc">diff</text><rect x="28.0" y="432" width="290.7" height="152" rx="10" fill="#26262d" stroke="#34343d"/><rect x="46.0" y="451" width="9" height="9" rx="2" fill="#00ff99"/><text x="63.0" y="460" class="sans b" font-size="15" fill="#f7f6f2">Dev checks</text><text x="300.7" y="460" class="mono" font-size="12" fill="#00ff99" text-anchor="end">jzr</text><text x="46.0" y="484" class="sans" font-size="12.5" fill="#9a9aa6">Tokens, checksums, Unix time, .env</text><rect x="46.0" y="496" width="254.7" height="1" fill="#34343d"/><text x="46.0" y="520" class="mono" font-size="12.5" fill="#d4d4dc">jwt</text><text x="46.0" y="539" class="mono" font-size="12.5" fill="#d4d4dc">hash</text><text x="46.0" y="558" class="mono" font-size="12.5" fill="#d4d4dc">timestamp</text><text x="173.3" y="520" class="mono" font-size="12.5" fill="#d4d4dc">env example</text><text x="173.3" y="539" class="mono" font-size="12.5" fill="#d4d4dc">env compare</text><rect x="334.7" y="432" width="290.7" height="152" rx="10" fill="#26262d" stroke="#34343d"/><rect x="352.7" y="451" width="9" height="9" rx="2" fill="#00ff99"/><text x="369.7" y="460" class="sans b" font-size="15" fill="#f7f6f2">Generators</text><text x="607.3" y="460" class="mono" font-size="12" fill="#00ff99" text-anchor="end">jzr</text><text x="352.7" y="484" class="sans" font-size="12.5" fill="#9a9aa6">UUIDs, passwords, secure random</text><rect x="352.7" y="496" width="254.7" height="1" fill="#34343d"/><text x="352.7" y="520" class="mono" font-size="12.5" fill="#d4d4dc">uuid</text><text x="352.7" y="539" class="mono" font-size="12.5" fill="#d4d4dc">password</text><text x="352.7" y="558" class="mono" font-size="12.5" fill="#d4d4dc">random int</text><text x="480.0" y="520" class="mono" font-size="12.5" fill="#d4d4dc">random pick</text><text x="480.0" y="539" class="mono" font-size="12.5" fill="#d4d4dc">random shuffle</text><rect x="641.3" y="432" width="290.7" height="152" rx="10" fill="#26262d" stroke="#34343d"/><rect x="659.3" y="451" width="9" height="9" rx="2" fill="#00ff99"/><text x="676.3" y="460" class="sans b" font-size="15" fill="#f7f6f2">Files &amp; shortcuts</text><text x="914.0" y="460" class="mono" font-size="12" fill="#00ff99" text-anchor="end">jzr</text><text x="659.3" y="484" class="sans" font-size="12.5" fill="#9a9aa6">Bulk renames with a preview</text><rect x="659.3" y="496" width="254.7" height="1" fill="#34343d"/><text x="659.3" y="520" class="mono" font-size="12.5" fill="#d4d4dc">file rename</text><text x="659.3" y="539" class="mono" font-size="12.5" fill="#d4d4dc">bind add</text><text x="659.3" y="558" class="mono" font-size="12.5" fill="#d4d4dc">bind list</text><text x="786.7" y="520" class="mono" font-size="12.5" fill="#d4d4dc">bind remove</text><rect x="28.0" y="600" width="290.7" height="152" rx="10" fill="#26262d" stroke="#34343d"/><rect x="46.0" y="619" width="9" height="9" rx="2" fill="#00ff99"/><text x="63.0" y="628" class="sans b" font-size="15" fill="#f7f6f2">Ports</text><text x="300.7" y="628" class="mono" font-size="12" fill="#00ff99" text-anchor="end">jzr port</text><text x="46.0" y="652" class="sans" font-size="12.5" fill="#9a9aa6">See what holds a port, then free it</text><rect x="46.0" y="664" width="254.7" height="1" fill="#34343d"/><text x="46.0" y="688" class="mono" font-size="12.5" fill="#d4d4dc">show</text><text x="46.0" y="707" class="mono" font-size="12.5" fill="#d4d4dc">kill</text><text x="46.0" y="726" class="mono" font-size="12.5" fill="#d4d4dc">killport</text><rect x="334.7" y="600" width="290.7" height="152" rx="10" fill="#26262d" stroke="#34343d"/><rect x="352.7" y="619" width="9" height="9" rx="2" fill="#00ff99"/><text x="369.7" y="628" class="sans b" font-size="15" fill="#f7f6f2">Your machine</text><text x="607.3" y="628" class="mono" font-size="12" fill="#00ff99" text-anchor="end">jzr host</text><text x="352.7" y="652" class="sans" font-size="12.5" fill="#9a9aa6">Status, cache clean-up, memory hogs</text><rect x="352.7" y="664" width="254.7" height="1" fill="#34343d"/><text x="352.7" y="688" class="mono" font-size="12.5" fill="#d4d4dc">status</text><text x="352.7" y="707" class="mono" font-size="12.5" fill="#d4d4dc">clean</text><text x="352.7" y="726" class="mono" font-size="12.5" fill="#d4d4dc">procs</text><rect x="641.3" y="600" width="290.7" height="152" rx="10" fill="#26262d" stroke="#34343d"/><rect x="659.3" y="619" width="9" height="9" rx="2" fill="#00ff99"/><text x="676.3" y="628" class="sans b" font-size="15" fill="#f7f6f2">AI agents</text><text x="914.0" y="628" class="mono" font-size="12" fill="#00ff99" text-anchor="end">jzr agent</text><text x="659.3" y="652" class="sans" font-size="12.5" fill="#9a9aa6">Skill and MCP server for AI agents</text><rect x="659.3" y="664" width="254.7" height="1" fill="#34343d"/><text x="659.3" y="688" class="mono" font-size="12.5" fill="#d4d4dc">install</text><text x="659.3" y="707" class="mono" font-size="12.5" fill="#d4d4dc">mcp</text><text x="659.3" y="726" class="mono" font-size="12.5" fill="#d4d4dc">skill</text><text x="786.7" y="688" class="mono" font-size="12.5" fill="#d4d4dc">remove</text><text x="28" y="784" class="sans" font-size="13" fill="#9a9aa6">Also: <tspan class="mono" fill="#d4d4dc">jzr ffmpeg install</tspan> fetches ffmpeg for you, <tspan class="mono" fill="#d4d4dc">jzr completion install</tspan> sets up tab completion. Add <tspan class="mono" fill="#d4d4dc">-h</tspan> to anything for help.</text></svg>
