<svg xmlns="http://www.w3.org/2000/svg" width="960" height="549" viewBox="0 0 960 549" role="img" aria-label="A terminal running jzr image, video, pdf and password commands"><title>A terminal running jzr image, video, pdf and password commands</title><style>
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','IBM Plex Sans',Helvetica,Arial,sans-serif}
.b{font-weight:700}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cursor{animation:blink 1.1s step-end infinite}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
</style><defs><clipPath id="w"><rect width="100%" height="100%" rx="12"/></clipPath></defs><g clip-path="url(#w)"><rect width="960" height="549" fill="#1c1c22"/><rect width="960" height="42" fill="#232329"/><rect y="42" width="960" height="1" fill="#34343d"/></g><rect x=".5" y=".5" width="959" height="548" rx="11.5" fill="none" stroke="#34343d"/><circle cx="24" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="64" cy="21" r="6" fill="#28c840"/><text x="480.0" y="26" class="mono" font-size="12" fill="#9a9aa6" text-anchor="middle">jzr — ~/demo</text><g transform="translate(890 14) scale(0.2121)"><g fill="#F7F6F2" fill-rule="evenodd"><path transform="translate(3 3)" d="M27 0H58V44Q58 60 42 60H15Q0 60 0 45V38H14V44Q14 47 18 47H39Q44 47 44 42V13H27Z"/><path transform="translate(73 3)" d="M0 0H62V12L21 47H62V60H0V48L41 13H0Z"/><path transform="translate(143 3)" d="M0 0H45Q60 0 60 15V25Q60 37 48 39L62 60H45L30 40H14V60H0Z M14 13H41Q46 13 46 18V22Q46 27 41 27H14Z"/></g><rect x="213" y="49" width="14" height="14" rx="3" fill="#00FF99"/></g><text x="26" y="78" class="mono" font-size="13" xml:space="preserve"><tspan fill="#00ff99" class="b">$ </tspan><tspan fill="#f7f6f2" class="b">jzr</tspan><tspan fill="#f7f6f2"> image convert --to webp -d Photos</tspan></text><text x="26" y="99" class="mono" font-size="13" xml:space="preserve"><tspan fill="#d4d4dc">Photos/IMG_0412.png</tspan><tspan fill="#00ff99"> -&gt; </tspan><tspan fill="#d4d4dc">Photos/IMG_0412.webp</tspan></text><text x="26" y="120" class="mono" font-size="13" xml:space="preserve"><tspan fill="#d4d4dc">Photos/IMG_0413.png</tspan><tspan fill="#00ff99"> -&gt; </tspan><tspan fill="#d4d4dc">Photos/IMG_0413.webp</tspan></text><text x="26" y="141" class="mono" font-size="13" xml:space="preserve"><tspan fill="#d4d4dc">Photos/IMG_0414.png</tspan><tspan fill="#00ff99"> -&gt; </tspan><tspan fill="#d4d4dc">Photos/IMG_0414.webp</tspan></text><text x="26" y="162" class="mono" font-size="13" fill="#9a9aa6">pillow: 3 converted</text><text x="26" y="204" class="mono" font-size="13" xml:space="preserve"><tspan fill="#00ff99" class="b">$ </tspan><tspan fill="#f7f6f2" class="b">jzr</tspan><tspan fill="#f7f6f2"> image compress IMG_0412.png --to jpg -s 500KB</tspan></text><text x="26" y="225" class="mono" font-size="13" xml:space="preserve"><tspan fill="#d4d4dc">IMG_0412.png</tspan><tspan fill="#00ff99"> -&gt; </tspan><tspan fill="#d4d4dc">IMG_0412_compressed.jpg</tspan><tspan fill="#9a9aa6"> (9.7 MB -&gt; 488.8 kB, -95%, quality 79, resized to 1333x888 to fit)</tspan></text><text x="26" y="267" class="mono" font-size="13" xml:space="preserve"><tspan fill="#00ff99" class="b">$ </tspan><tspan fill="#f7f6f2" class="b">jzr</tspan><tspan fill="#f7f6f2"> video compress clip.mov --for discord</tspan></text><text x="26" y="288" class="mono" font-size="13" xml:space="preserve"><tspan fill="#d4d4dc">clip.mov</tspan><tspan fill="#00ff99"> -&gt; </tspan><tspan fill="#d4d4dc">clip_compressed.mp4</tspan><tspan fill="#9a9aa6"> (video encoded to h264 at 7.55 Mb/s, audio copied; 18.9 MB of 20.0 MB)</tspan></text><text x="26" y="330" class="mono" font-size="13" xml:space="preserve"><tspan fill="#00ff99" class="b">$ </tspan><tspan fill="#f7f6f2" class="b">jzr</tspan><tspan fill="#f7f6f2"> video gif clip.mov --start 2 --duration 3</tspan></text><text x="26" y="351" class="mono" font-size="13" xml:space="preserve"><tspan fill="#d4d4dc">clip.mov</tspan><tspan fill="#00ff99"> -&gt; </tspan><tspan fill="#d4d4dc">clip.gif</tspan><tspan fill="#9a9aa6"> (480x270, 15 fps)</tspan></text><text x="26" y="393" class="mono" font-size="13" xml:space="preserve"><tspan fill="#00ff99" class="b">$ </tspan><tspan fill="#f7f6f2" class="b">jzr</tspan><tspan fill="#f7f6f2"> pdf from-images Photos/*.webp -o album.pdf</tspan></text><text x="26" y="414" class="mono" font-size="13" xml:space="preserve"><tspan fill="#d4d4dc">Photos/IMG_0412.webp + 2 more</tspan><tspan fill="#00ff99"> -&gt; </tspan><tspan fill="#d4d4dc">album.pdf</tspan><tspan fill="#9a9aa6"> (3 pages, 9.2 MB)</tspan></text><text x="26" y="456" class="mono" font-size="13" xml:space="preserve"><tspan fill="#00ff99" class="b">$ </tspan><tspan fill="#f7f6f2" class="b">jzr</tspan><tspan fill="#f7f6f2"> password -w 4</tspan></text><text x="26" y="477" class="mono" font-size="13" fill="#d4d4dc">urgent-bubbly-childhood-floss</text><text x="26" y="519" class="mono b" font-size="13" fill="#00ff99">$</text><rect class="cursor" x="42" y="507" width="8" height="15" fill="#00ff99"/></svg>
