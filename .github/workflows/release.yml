name: Release

# Push a tag such as v0.1.0 to publish that version to PyPI. The tag must
# match the version in pyproject.toml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: check the tag against the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match version $version in pyproject.toml (expected v$version)"
            exit 1
          fi

  # The full test matrix and the package build from the CI workflow. Its
  # package job uploads the sdist and wheel as the "dist" artifact.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/jzr-tools/
    permissions:
      # Trusted publishing: PyPI accepts this job's OIDC token, no API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
